<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Версия 5.6 | Мега-Конспект</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Marck+Script&family=Pacifico&family=Press+Start+2P&family=Roboto:wght@300;400;700&family=Russo+One&family=Yeseva+One&family=Lobster&family=Playfair+Display:wght@400;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000; --card: #111111; --text: #ffffff; --muted: #888888; 
    --accent: #ffcc00; --accent2: #ff0000; --border: #333333;
    --font-main: 'Segoe UI', system-ui, sans-serif;
    --bubble-bg: #111111;
    --zoom-level: 1;
    --verity-color: #991b1b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: var(--font-main);
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh; height: 100dvh;
    overflow: hidden;
    transition: background 0.3s ease, color 0.3s ease;
    user-select: none;
    font-size: calc(16px * var(--zoom-level));
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 3px; }

  .topbar {
    height: 50px; background: var(--card);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 10px; border-bottom: 1px solid var(--border);
    flex-shrink: 0; z-index: 100;
  }
  .topbar h2 { font-size: 0.85em; color: var(--accent); }
  .topbar .version { font-size: 0.7em; color: var(--muted); margin-left: 5px; font-weight: normal; }
  .controls { display: flex; gap: 8px; align-items: center; }
  
  .theme-select, .lang-select {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    padding: 4px 6px; border-radius: 6px; cursor: pointer; font-family: inherit; outline: none;
    font-size: 0.75em; max-width: 140px;
  }

  .draggable-widget {
    position: fixed; top: 60px; right: 5px; left: auto;
    background: var(--card); border: 1px solid var(--border);
    padding: 10px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    cursor: grab; z-index: 200; display: none; flex-direction: column; gap: 8px;
    width: 280px; max-width: 90vw; max-height: 80vh; overflow-y: auto;
  }
  .draggable-widget:active { cursor: grabbing; }
  .draggable-widget h3 { font-size: 0.8em; color: var(--accent); margin-bottom: 3px; }
  .draggable-widget select, .draggable-widget input[type="color"], .draggable-widget input[type="range"] {
    width: 100%; padding: 6px; border-radius: 4px; background: var(--bg);
    color: var(--text); border: 1px solid var(--border); font-family: inherit;
    font-size: 0.8em;
  }

  .main-content {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 15px 10px; display: flex; justify-content: center;
    -webkit-overflow-scrolling: touch;
  }
  .slide {
    background: var(--card); width: 100%; max-width: 800px;
    padding: 20px; border-radius: 15px; border: 1px solid var(--border);
    display: none; flex-direction: column;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    opacity: 0; transform: translateY(20px);
  }
  .slide.active { 
    display: flex; opacity: 1; transform: translateY(0); 
    animation: slideIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(20px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  h1 {
    font-size: 1.4em; color: var(--accent);
    margin-bottom: 15px; text-align: center;
    border-bottom: 2px dashed var(--border);
    padding-bottom: 10px; cursor: pointer;
  }
  h2 { color: var(--accent); margin-bottom: 10px; font-size: 1.1em; }
  p { font-size: 0.95em; line-height: 1.6; margin-bottom: 10px; }
  ul { margin-left: 20px; margin-bottom: 10px; line-height: 1.6; font-size: 0.95em; }
  li { margin-bottom: 5px; }
  
  .example {
    background: var(--bg); padding: 10px; border-radius: 8px;
    border-left: 4px solid var(--accent); margin: 10px 0;
    font-family: monospace; font-size: 0.95em;
  }
  .example.cont { border-left-color: var(--accent2); }

  .nav-bar {
    height: 60px; background: var(--card);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 10px; border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .nav-btn {
    background: var(--accent); color: #000; border: none; padding: 8px 15px;
    border-radius: 8px; font-size: 0.9em; cursor: pointer; font-weight: bold;
    transition: background 0.3s; font-family: inherit;
  }
  .nav-btn:hover { background: #d97706; }
  .nav-btn:disabled { background: var(--muted); cursor: not-allowed; }
  .page-counter { color: var(--muted); font-weight: bold; font-size: 0.9em; }

  .image-container { display: flex; flex-direction: column; align-items: center; gap: 15px; margin-top: 10px; }
  .image-container img {
    max-width: 100%; max-height: 250px; border-radius: 10px;
    border: 3px solid var(--accent); box-shadow: 0 0 15px rgba(0,0,0,0.3);
  }
  
  .dev-frame {
    width: 200px; height: 200px; border-radius: 15px;
    border: 6px solid #ffffff; box-shadow: 0 0 25px rgba(255,255,255,0.5);
    overflow: hidden; margin: 0 auto 15px auto; display: flex;
    align-items: center; justify-content: center; background: #fff;
  }
  .dev-frame img { width: 100%; height: 100%; object-fit: cover; }

  .creator-signature {
    font-family: 'Marck Script', cursive;
    font-size: 1.8em;
    color: var(--text);
    text-align: center;
    margin-top: 15px;
    line-height: 1.4;
    opacity: 0.9;
  }

  .start-btn {
    background: #22c55e; color: var(--text); border: none;
    padding: 15px 40px; border-radius: 12px; font-size: 1.5em;
    font-weight: bold; cursor: pointer; box-shadow: 0 5px 15px rgba(34,197,94,0.4);
    transition: background 0.3s, transform 0.1s;
    display: block; margin: 20px auto; font-family: var(--font-main);
    width: 100%; max-width: 300px;
  }
  .start-btn:active { transform: scale(0.95); }

  .clicker-area {
    display: flex; flex-direction: column; align-items: center; gap: 15px;
    background: var(--bg); padding: 15px; border-radius: 15px; margin-top: 10px;
    position: relative; overflow: hidden; width: 100%;
  }
  
  .coin-wrapper {
    position: relative; width: 150px; height: 200px;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
  }
  
  .verity-title {
    font-size: 1.2em; color: var(--accent); font-weight: bold;
    margin-bottom: 5px; text-align: center;
  }

  .coin {
    width: 120px; height: 120px; background: radial-gradient(circle at 30% 30%, #fcd34d, #b45309);
    border-radius: 50%; border: 6px solid #78350f; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5em; font-weight: bold; color: #78350f;
    box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    transition: transform 0.1s, opacity 0.3s;
    user-select: none; position: absolute;
  }
  
  .ball {
    width: 120px; height: 120px; background: radial-gradient(circle at 30% 30%, #f87171, var(--verity-color));
    border-radius: 50%; border: 6px solid #450a0a; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 0 25px #ef4444;
    animation: ballPulse 1s infinite alternate;
    user-select: none; position: relative; transition: all 0.3s;
  }
  
  .ball-eyes { display: flex; gap: 15px; margin-bottom: 5px; }
  .eye { width: 20px; height: 20px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .pupil { width: 8px; height: 8px; background: black; border-radius: 50%; }
  .mouth { width: 30px; height: 15px; border-bottom: 4px solid #450a0a; border-radius: 0 0 15px 15px; }

  @keyframes ballPulse { from { transform: scale(1); } to { transform: scale(1.05); } }

  .monster {
    width: 150px; height: 300px;
    background: radial-gradient(circle at 30% 30%, #f87171, var(--verity-color));
    border-radius: 50% 50% 10% 10%;
    border: 6px solid #450a0a;
    box-shadow: 0 0 40px #ef4444;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; animation: monsterGrow 0.5s ease-out;
  }
  @keyframes monsterGrow {
    from { transform: scaleY(0.5); opacity: 0; }
    to { transform: scaleY(1); opacity: 1; }
  }

  .speech-bubble {
    position: absolute; top: -80px; left: 50%; transform: translateX(-50%);
    background: var(--bubble-bg); color: var(--text);
    padding: 10px 15px; border-radius: 15px;
    font-size: 0.85em; text-align: center; width: 250px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    z-index: 10;
    border: 2px solid var(--accent);
    transition: background 0.5s, border-color 0.5s;
    font-family: var(--font-main);
    min-height: 50px;
    display: flex; align-items: center; justify-content: center;
  }
  .speech-bubble::after {
    content: ''; position: absolute; bottom: -10px; left: 50%;
    transform: translateX(-50%); border-width: 10px 10px 0;
    border-style: solid; border-color: var(--bubble-bg) transparent transparent transparent;
  }

  .score-big { font-size: 1.5em; color: var(--accent); font-weight: bold; }

  .upgrades-grid {
    display: grid; grid-template-columns: 1fr;
    gap: 10px; width: 100%; margin-top: 10px;
  }
  .upgrade-card {
    background: var(--card); border: 1px solid var(--border);
    padding: 10px; border-radius: 10px; text-align: center;
  }
  .upgrade-card h4 { color: var(--accent); margin-bottom: 5px; font-size: 0.9em; }
  .upgrade-card p { font-size: 0.8em; color: var(--muted); margin-bottom: 5px; }
  .upgrade-btn {
    background: var(--accent2); color: #fff; border: none; padding: 8px 12px;
    border-radius: 6px; cursor: pointer; width: 100%; transition: 0.3s;
    font-family: inherit; font-size: 0.85em;
  }
  .upgrade-btn:hover:not(:disabled) { background: #dc2626; }
  .upgrade-btn:disabled { background: var(--muted); cursor: not-allowed; }

  #gameCanvas {
    background: var(--bg); border: 2px solid var(--border);
    border-radius: 8px; display: block; margin: 10px auto;
    box-shadow: 0 0 15px rgba(0,0,0,0.3);
    max-width: 100%; height: auto;
  }
  .snake-header {
    display: flex; justify-content: space-between; width: 100%; max-width: 400px; margin: 0 auto 10px auto;
    font-weight: bold; font-size: 1em;
  }

  .overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.9); z-index: 9999;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.3s; padding: 20px; text-align: center;
  }
  .overlay.show { display: flex; opacity: 1; }
  
  .overlay img {
    max-width: 80%; max-height: 50vh; border-radius: 15px;
    border: 4px solid #ef4444; box-shadow: 0 0 40px #ef4444;
    animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
  
  .overlay h2 {
    color: #f59e0b; font-size: 1.5em; margin-top: 15px; font-weight: bold;
    text-shadow: 0 0 20px rgba(245, 158, 11, 0.8);
    font-family: 'Russo One', sans-serif;
  }

  .calligraphy-loss {
    font-family: 'Marck Script', cursive; color: #ff0000; font-size: 3em;
    text-shadow: 0 0 20px rgba(255,0,0,0.8); font-weight: bold;
    animation: lossPulse 1s infinite alternate;
  }
  @keyframes lossPulse { from { transform: scale(1); } to { transform: scale(1.05); } }

  /* 5 трещин */
  .screen-cracked::before {
    content: '';
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: 
      linear-gradient(20deg, transparent 48%, rgba(255,255,255,0.9) 49%, rgba(255,255,255,0.9) 51%, transparent 52%),
      linear-gradient(-40deg, transparent 48%, rgba(255,255,255,0.8) 49%, rgba(255,255,255,0.8) 51%, transparent 52%),
      linear-gradient(70deg, transparent 49.5%, rgba(255,255,255,0.85) 50%, rgba(255,255,255,0.85) 50.5%, transparent 51%),
      linear-gradient(-70deg, transparent 49.5%, rgba(255,255,255,0.75) 50%, rgba(255,255,255,0.75) 50.5%, transparent 51%),
      linear-gradient(45deg, transparent 49.5%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0.8) 50.5%, transparent 51%);
    pointer-events: none;
    z-index: 9998;
    animation: crackShow 10s forwards;
    opacity: 0.9;
  }
  @keyframes crackShow {
    0% { opacity: 1; }
    90% { opacity: 1; }
    100% { opacity: 0; }
  }

  .widget-toggle {
    position: fixed; bottom: 75px; right: 15px;
    background: var(--accent); color: #fff; border: none;
    width: 45px; height: 45px; border-radius: 50%;
    font-size: 14px; cursor: pointer; z-index: 300;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    display: flex; align-items: center; justify-content: center;
    transition: 0.3s;
  }
  .widget-toggle:hover { transform: rotate(90deg) scale(1.1); }

  @media (max-width: 400px) {
    .topbar h2 { font-size: 0.75em; }
    .topbar .version { display: none; }
    .theme-select, .lang-select { font-size: 0.7em; }
    .nav-btn { padding: 6px 10px; font-size: 0.8em; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <h2>Мега-Конспект <span class="version">Версия 5.6</span></h2>
    <div class="controls">
      <select class="lang-select" id="langSelect" onchange="changeLang(this.value)">
        <option value="ru">RU Русский</option>
        <option value="en">EN English</option>
      </select>
      <select class="theme-select" id="themeSelect"></select>
    </div>
  </div>

  <button class="widget-toggle" onclick="toggleWidgets()">⚙️</button>
  
  <div class="draggable-widget" id="widgetSettings">
    <h3>Настройки</h3>
    <label style="font-size: 0.7em; color: var(--muted);">Тема:</label>
    <select id="themeSelectWidget"></select>
    <label style="font-size: 0.7em; color: var(--muted); margin-top: 5px;">Масштаб:</label>
    <input type="range" id="zoomInput" min="0.8" max="1.5" step="0.1" value="1">
    <label style="font-size: 0.7em; color: var(--muted); margin-top: 5px;">Цвет текста:</label>
    <input type="color" id="textColorInput" value="#ffffff">
    <button id="devTabBtn" class="nav-btn" style="margin-top: 10px; display: none; background: var(--accent2);" onclick="openDevPanel()">Разработчик</button>
  </div>

  <div class="main-content" id="contentArea"></div>

  <div class="nav-bar">
    <button class="nav-btn" id="prevBtn" onclick="changeSlide(-1)">← Назад</button>
    <span class="page-counter" id="pageCounter">1 / 34</span>
    <button class="nav-btn" id="nextBtn" onclick="changeSlide(1)">Вперед →</button>
  </div>

  <div id="hogOverlay" class="overlay" onclick="hideHog()">
    <img src="totya.jpg" alt="Тотя" id="hogImg" style="display:none;">
    <h2 id="hogText">67</h2>
  </div>

<script>
  // === АУДИО ===
  let audioCtx = null;
  function playSound(freq, duration, type) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
  }

  // === ТЕМЫ ===
  const fixedThemes = [
    { name: "Чёрная", vars: { bg: "#000000", card: "#111111", text: "#ffffff", muted: "#888888", border: "#333333", accent: "#ffcc00", accent2: "#ff0000" } },
    { name: "Белая", vars: { bg: "#f1f5f9", card: "#ffffff", text: "#0f172a", muted: "#64748b", border: "#cbd5e1", accent: "#f59e0b", accent2: "#ef4444" } },
    { name: "Бирюзовая", vars: { bg: "#042f2e", card: "#134e4a", text: "#ccfbf1", muted: "#5eead4", border: "#115e59", accent: "#2dd4bf", accent2: "#14b8a6" } },
    { name: "Красная", vars: { bg: "#450a0a", card: "#7f1d1d", text: "#fee2e2", muted: "#fca5a5", border: "#991b1b", accent: "#ef4444", accent2: "#dc2626" } },
    { name: "Оранжевая", vars: { bg: "#431407", card: "#7c2d12", text: "#ffedd5", muted: "#fdba74", border: "#9a3412", accent: "#f97316", accent2: "#ea580c" } },
    { name: "Лазурная", vars: { bg: "#0c4a6e", card: "#075985", text: "#e0f2fe", muted: "#bae6fd", border: "#0369a1", accent: "#38bdf8", accent2: "#0ea5e9" } },
    { name: "Голубая", vars: { bg: "#164e63", card: "#155e75", text: "#cffafe", muted: "#a5f3fc", border: "#0891b2", accent: "#22d3ee", accent2: "#06b6d4" } },
    { name: "Синяя", vars: { bg: "#172554", card: "#1e3a8a", text: "#dbeafe", muted: "#bfdbfe", border: "#1d4ed8", accent: "#60a5fa", accent2: "#3b82f6" } }
  ];

  // Инициализация настроек
  function initSettings() {
    const sel1 = document.getElementById('themeSelect');
    const sel2 = document.getElementById('themeSelectWidget');
    
    fixedThemes.forEach((theme, i) => {
      const opt1 = document.createElement('option');
      opt1.value = i; opt1.textContent = theme.name;
      sel1.appendChild(opt1);
      
      const opt2 = document.createElement('option');
      opt2.value = i; opt2.textContent = theme.name;
      sel2.appendChild(opt2);
    });
    
    // Обработчики
    sel1.addEventListener('change', function() { applyTheme(parseInt(this.value)); });
    sel2.addEventListener('change', function() { applyTheme(parseInt(this.value)); });
    
    document.getElementById('zoomInput').addEventListener('input', function() {
      document.documentElement.style.setProperty('--zoom-level', this.value);
    });
    
    document.getElementById('textColorInput').addEventListener('input', function() {
      document.documentElement.style.setProperty('--text', this.value);
    });
    
    applyTheme(0);
  }

  function applyTheme(index) {
    const theme = fixedThemes[index];
    if (!theme) return;
    const root = document.documentElement;
    root.style.setProperty('--bg', theme.vars.bg);
    root.style.setProperty('--card', theme.vars.card);
    root.style.setProperty('--text', theme.vars.text);
    root.style.setProperty('--muted', theme.vars.muted);
    root.style.setProperty('--border', theme.vars.border);
    root.style.setProperty('--accent', theme.vars.accent);
    root.style.setProperty('--accent2', theme.vars.accent2);
    root.style.setProperty('--bubble-bg', theme.vars.card);
    
    document.getElementById('themeSelect').selectedIndex = index;
    document.getElementById('themeSelectWidget').selectedIndex = index;
    document.getElementById('textColorInput').value = theme.vars.text;
  }

  let widgetVisible = false;
  function toggleWidgets() {
    widgetVisible = !widgetVisible;
    document.getElementById('widgetSettings').style.display = widgetVisible ? 'flex' : 'none';
    playSound(widgetVisible ? 800 : 400, 0.1, 'sine');
  }

  function changeLang(lang) {
    // Заглушка
  }

  // === 34 СТРАНИЦЫ ===
  const baseSlides = [];
  const topics = [
    { t: "Введение", b: "<p>Добро пожаловать в конспект!</p>" },
    { t: "Что такое Present Simple?", b: "<p>Регулярные действия и факты.</p><div class='example'>I play tennis.</div>" },
    { t: "Образование Present Simple", b: "<ul><li>+s/es для he/she/it</li></ul>" },
    { t: "Маркеры Present Simple", b: "<ul><li>always, usually, every day</li></ul>" },
    { t: "Что такое Present Continuous?", b: "<p>Действия прямо сейчас.</p><div class='example cont'>I am reading.</div>" },
    { t: "Образование Present Continuous", b: "<ul><li>am/is/are + ing</li></ul>" },
    { t: "Маркеры Present Continuous", b: "<ul><li>now, at the moment</li></ul>" },
    { t: "Сравнение", b: "<p>Simple = рутина, Continuous = процесс.</p>" },
    { t: "Stative Verbs", b: "<p>like, love, know.</p>" },
    { t: "Правило -ing", b: "<p>play -> playing.</p>" },
    { t: "Отрицание", b: "<p>I don't like / I am not reading.</p>" },
    { t: "Вопросы", b: "<p>Do you like? / Are you reading?</p>" },
    { t: "Наречия частоты", b: "<p>I always drink coffee.</p>" },
    { t: "Глаголы, меняющие значение", b: "<p>see (видеть) vs see (встречаться).</p>" },
    { t: "Примеры 1", b: "<div class='example'>I work every day.</div>" },
    { t: "Примеры 2", b: "<div class='example cont'>I am working now.</div>" },
    { t: "Примеры 3", b: "<div class='example'>She reads books.</div>" },
    { t: "Примеры 4", b: "<div class='example cont'>She is reading a book.</div>" },
    { t: "Практика 1", b: "<p>I ___ (play) tennis now. -> am playing.</p>" },
    { t: "Практика 2", b: "<p>He ___ (go) to school every day. -> goes.</p>" },
    { t: "Практика 3", b: "<p>They ___ (not / like) coffee. -> don't like.</p>" },
    { t: "Практика 4", b: "<p>We ___ (meet) tomorrow. -> are meeting.</p>" },
    { t: "Практика 5", b: "<p>Water ___ (boil) at 100°C. -> boils.</p>" },
    { t: "Исключения", b: "<p>have (иметь) / have (испытывать).</p>" },
    { t: "Итог 1", b: "<p>Simple = факт, Continuous = процесс.</p>" },
    { t: "Итог 2", b: "<p>Маркеры: always / now.</p>" },
    { t: "Итог 3", b: "<p>Форма: V / V+ing.</p>" },
    { t: "Бонус 1", b: "<p>Повторите все правила.</p>" },
    { t: "Бонус 2", b: "<p>Переходите к играм!</p>" },
    { t: "Змейка", b: "<div style='text-align:center;'><button class='start-btn' id='snakeStartBtn' onmousedown='startDevHold()' onmouseup='endDevHold()' onmouseleave='endDevHold()' onclick='startSnake()'>Начнём?</button><div class='snake-header'><span>Счет: <span id='snakeScore'>0</span></span><span>Рекорд: <span id='snakeRecord'>0</span></span></div><canvas id='gameCanvas' width='400' height='400' style='display:none;'></canvas></div>" },
    { t: "Кликер", b: "<div class='clicker-area'><button class='start-btn' id='clickerStartBtn' onmousedown='startDevHold()' onmouseup='endDevHold()' onmouseleave='endDevHold()' onclick='initClicker()'>Начнём?</button><div id='clickerUI' style='display:none;'><div class='score-big' id='scoreDisplay'>0</div><div class='coin-wrapper' id='coinWrapper'><div class='coin' id='coinBtn' onclick='clickCoin()'>Монета</div></div><div style='font-size:0.8em; color:var(--muted); text-align:center; margin-top:10px;' id='progressDisplay'>До попытки: 0 / 167</div></div></div>" },
    { t: "Разработчик", b: "<div style='text-align:center;'><div class='dev-frame'><img src='anime.jpg' alt='Anime'></div><div class='creator-signature'>Разработчик<br>Магдеев Тимур<br>(Термометр)</div></div>" },
    { t: "Пасхалка!", b: "<p style='text-align:center;'>Нажми на заголовок 3 раза!</p>" }
  ];

  for (let i = 1; i <= 34; i++) {
    const topic = topics[(i - 1) % topics.length];
    baseSlides.push({ ru: { title: `${i}. ${topic.t}`, body: topic.b } });
  }

  let currentSlide = 0;
  let clickCount = 0;
  let record = localStorage.getItem('snakeRecord') || 0;
  let coinClickCounter = 0;
  let attemptCounter = 0;
  let verityPhrase = "Hey it's me, it's verity";

  function renderSlides() {
    const area = document.getElementById('contentArea');
    area.innerHTML = '';
    baseSlides.forEach((slide, index) => {
      const div = document.createElement('div');
      div.className = 'slide' + (index === currentSlide ? ' active' : '');
      div.id = 'slide-' + index;
      
      const isEasterEgg = (index === 33);
      const titleAttr = isEasterEgg ? "onclick='handleEggClick()'" : "";
      
      div.innerHTML = `<h1 ${titleAttr}>${slide.ru.title}</h1><div>${slide.ru.body}</div>`;
      area.appendChild(div);
    });
  }

  function changeSlide(dir) {
    currentSlide += dir;
    if (currentSlide < 0) currentSlide = 0;
    if (currentSlide >= baseSlides.length) currentSlide = baseSlides.length - 1;
    
    document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
    const active = document.getElementById('slide-' + currentSlide);
    if (active) active.classList.add('active');
    
    document.getElementById('prevBtn').disabled = currentSlide === 0;
    document.getElementById('nextBtn').disabled = currentSlide === baseSlides.length - 1;
    document.getElementById('pageCounter').textContent = (currentSlide + 1) + ' / ' + baseSlides.length;
    document.getElementById('contentArea').scrollTop = 0;

    playSound(500, 0.05, 'square');

    if (currentSlide === 29) initSnakePage();
    if (currentSlide === 30) initClickerPage();
  }

  function handleEggClick() {
    clickCount++;
    clearTimeout(window.eggTimer);
    if (clickCount === 3) {
      document.getElementById('hogImg').style.display = 'block';
      document.getElementById('hogImg').src = 'totya.jpg';
      document.getElementById('hogText').textContent = 'Тотя ❤️';
      document.getElementById('hogOverlay').classList.add('show');
      clickCount = 0;
      playSound(1000, 0.2, 'sine');
    } else {
      window.eggTimer = setTimeout(() => clickCount = 0, 600);
    }
  }
  function hideHog() { document.getElementById('hogOverlay').classList.remove('show'); }

  // === ЗМЕЙКА ===
  let snakeCanvas, snakeCtx, snake, snakeDir, food, gameLoop;
  let snakeMoving = false;

  function initSnakePage() {
    const btn = document.getElementById('snakeStartBtn');
    if (btn) { btn.style.display = 'block'; }
    if (snakeCanvas) { snakeCanvas.style.display = 'none'; }
    snakeMoving = false;
  }

  function startSnake() {
    playSound(800, 0.15, 'sine');
    const btn = document.getElementById('snakeStartBtn');
    if (btn) btn.style.display = 'none';
    
    snakeCanvas = document.getElementById('gameCanvas');
    snakeCanvas.style.display = 'block';
    snakeCtx = snakeCanvas.getContext('2d');
    snake = [{x: 10, y: 10}];
    snakeDir = {x: 0, y: 0};
    snakeMoving = false;
    let targetX = 10, targetY = 10;
    document.getElementById('snakeScore').textContent = 0;
    document.getElementById('snakeRecord').textContent = record;
    placeFood();
    drawSnake();
    
    clearInterval(gameLoop);
    gameLoop = setInterval(() => {
      if (!snakeMoving) return;
      targetX += snakeDir.x;
      targetY += snakeDir.y;
      if (targetX < 0 || targetX >= 20 || targetY < 0 || targetY >= 20) { gameOver(); return; }
      for (let i = 0; i < snake.length; i++) { if (snake[i].x === targetX && snake[i].y === targetY) { gameOver(); return; } }
      snake.unshift({x: targetX, y: targetY});
      if (targetX === food.x && targetY === food.y) {
        document.getElementById('snakeScore').textContent = snake.length - 1;
        if (snake.length - 1 > record) { record = snake.length - 1; localStorage.setItem('snakeRecord', record); document.getElementById('snakeRecord').textContent = record; }
        if (snake.length - 1 === 67) {
          document.getElementById('hogImg').style.display = 'block';
          document.getElementById('hogImg').src = 'meme.jpg';
          document.getElementById('hogText').textContent = '67!';
          document.getElementById('hogOverlay').classList.add('show');
          playSound(1200, 0.3, 'sawtooth');
        }
        playSound(600, 0.1, 'sine');
        placeFood();
      } else { snake.pop(); }
      drawSnake();
    }, 120);
    
    document.addEventListener('keydown', snakeKeyHandler);
    snakeCanvas.addEventListener('touchstart', snakeTouchStart);
    document.addEventListener('touchend', snakeTouchEnd);
  }

  function snakeKeyHandler(e) {
    if (currentSlide !== 29) return;
    if (!snakeMoving) snakeMoving = true;
    if (e.key === 'ArrowUp' && snakeDir.y === 0) snakeDir = {x: 0, y: -1};
    if (e.key === 'ArrowDown' && snakeDir.y === 0) snakeDir = {x: 0, y: 1};
    if (e.key === 'ArrowLeft' && snakeDir.x === 0) snakeDir = {x: -1, y: 0};
    if (e.key === 'ArrowRight' && snakeDir.x === 0) snakeDir = {x: 1, y: 0};
  }

  let touchStartX = 0, touchStartY = 0;
  function snakeTouchStart(e) {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    e.preventDefault();
  }
  function snakeTouchEnd(e) {
    if (currentSlide !== 29) return;
    if (!snakeMoving) snakeMoving = true;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx > 30 && snakeDir.x === 0) snakeDir = {x: 1, y: 0};
      if (dx < -30 && snakeDir.x === 0) snakeDir = {x: -1, y: 0};
    } else {
      if (dy > 30 && snakeDir.y === 0) snakeDir = {x: 0, y: 1};
      if (dy < -30 && snakeDir.y === 0) snakeDir = {x: 0, y: -1};
    }
  }

  function placeFood() { food = { x: Math.floor(Math.random() * 20), y: Math.floor(Math.random() * 20) }; }

  function drawSnake() {
    snakeCtx.fillStyle = '#000000';
    snakeCtx.fillRect(0, 0, 400, 400);
    snakeCtx.fillStyle = '#ef4444';
    snakeCtx.beginPath();
    snakeCtx.arc(food.x * 20 + 10, food.y * 20 + 10, 8, 0, Math.PI * 2);
    snakeCtx.fill();
    snake.forEach((seg, i) => {
      snakeCtx.fillStyle = i === 0 ? '#ffcc00' : '#fcd34d';
      snakeCtx.fillRect(seg.x * 20 + 1, seg.y * 20 + 1, 18, 18);
    });
  }

  function gameOver() {
    clearInterval(gameLoop);
    playSound(200, 0.5, 'sawtooth');
    document.getElementById('hogOverlay').innerHTML = '<h2 class="calligraphy-loss">ВЫ ПРОИГРАЛИ</h2>';
    document.getElementById('hogOverlay').classList.add('show');
  }

  // === КЛИКЕР ===
  let score = 0;
  let cPower = 1;
  let isVerity = false;
  let verityClicks = 0;
  let verityTalking = false;
  let verityTimeout;

  function initClickerPage() {
    document.getElementById('clickerStartBtn').style.display = 'block';
    document.getElementById('clickerUI').style.display = 'none';
  }

  function initClicker() {
    playSound(800, 0.15, 'sine');
    document.getElementById('clickerStartBtn').style.display = 'none';
    document.getElementById('clickerUI').style.display = 'flex';
    document.getElementById('scoreDisplay').textContent = 0;
    coinClickCounter = 0;
    attemptCounter = 0;
    updateProgress();
  }

  function updateProgress() {
    const progressEl = document.getElementById('progressDisplay');
    if (!progressEl) return;
    if (coinClickCounter < 167) {
      progressEl.textContent = `До попытки: ${coinClickCounter} / 167`;
    } else {
      progressEl.textContent = `Шанс 35%`;
    }
  }

  function clickCoin() {
    if (isVerity) {
      verityClicks++;
      if (verityTalking) {
        verityTalking = false;
        clearTimeout(verityTimeout);
        const bubble = document.querySelector('.speech-bubble');
        if (bubble) bubble.remove();
        playSound(400, 0.2, 'sawtooth');
        
        const wrapper = document.getElementById('coinWrapper');
        const ball = wrapper.querySelector('.ball');
        if (ball) {
          const stopBubble = document.createElement('div');
          stopBubble.className = 'speech-bubble';
          stopBubble.textContent = 'Стоп';
          stopBubble.style.fontFamily = 'var(--font-main)';
          stopBubble.style.fontSize = '1em';
          ball.appendChild(stopBubble);
          setTimeout(() => { if (stopBubble.parentNode) stopBubble.remove(); }, 1000);
        }
      }
      
      if (verityClicks >= 3) {
        verityClicks = 0;
        const wrapper = document.getElementById('coinWrapper');
        wrapper.innerHTML = `
          <div class="monster" onclick="resetClicker()">
            <div class="speech-bubble" style="font-family: var(--font-main);">${verityPhrase}</div>
          </div>
        `;
        document.body.classList.add('screen-cracked');
        playSound(150, 0.8, 'sawtooth');
        setTimeout(() => {
          document.body.classList.remove('screen-cracked');
          resetClicker();
        }, 10000);
      }
      return;
    }

    coinClickCounter++;
    score++;
    document.getElementById('scoreDisplay').textContent = score;
    playSound(700 + Math.random() * 300, 0.05, 'square');
    updateProgress();
    
    if (coinClickCounter === 67) {
      document.getElementById('hogImg').style.display = 'block';
      document.getElementById('hogImg').src = 'meme.jpg';
      document.getElementById('hogText').textContent = '67!';
      document.getElementById('hogOverlay').classList.add('show');
      playSound(1200, 0.3, 'sawtooth');
    }

    if (coinClickCounter >= 167) {
      if (Math.random() < 0.35) {
        spawnVerity();
      }
    }
  }

  function spawnVerity() {
    const wrapper = document.getElementById('coinWrapper');
    wrapper.innerHTML = `
      <div class="verity-title">Верити</div>
      <div class="ball" onclick="clickCoin()">
        <div class="speech-bubble" style="font-family: var(--font-main);">
          <span class="anim-fade" style="--anim-speed: 0.5s;">${verityPhrase}</span>
        </div>
        <div class="ball-eyes"><div class="eye"><div class="pupil"></div></div><div class="eye"><div class="pupil"></div></div></div>
        <div class="mouth"></div>
      </div>
      <div style="font-size:0.8em; color:var(--muted); text-align:center; margin-top:10px;" id="progressDisplay">До попытки: 0 / 167</div>
    `;
    isVerity = true;
    verityTalking = true;
    verityClicks = 0;
    playSound(900, 0.3, 'sine');
    
    verityTimeout = setTimeout(() => {
      if (verityTalking) {
        verityTalking = false;
        const bubble = document.querySelector('.speech-bubble');
        if (bubble) bubble.remove();
      }
    }, 3000);
  }

  function resetClicker() {
    score = 0;
    coinClickCounter = 0;
    attemptCounter = 0;
    isVerity = false;
    verityTalking = false;
    const wrapper = document.getElementById('coinWrapper');
    if (wrapper) {
      wrapper.innerHTML = `
        <div class="coin" id="coinBtn" onclick="clickCoin()">Монета</div>
        <div style="font-size:0.8em; color:var(--muted); text-align:center; margin-top:10px;" id="progressDisplay">До попытки: 0 / 167</div>
      `;
    }
    document.getElementById('scoreDisplay').textContent = 0;
    document.getElementById('hogOverlay').classList.remove('show');
    document.getElementById('hogOverlay').innerHTML = '<img src="totya.jpg" alt="Тотя" id="hogImg" style="display:none;"><h2 id="hogText">67</h2>';
    updateProgress();
  }

  // === НАСТРОЙКИ РАЗРАБОТЧИКА ===
  let devHoldTimer = null;
  let devHoldStart = 0;

  function startDevHold() {
    devHoldStart = Date.now();
    devHoldTimer = setInterval(() => {
      if (Date.now() - devHoldStart >= 45000) {
        clearInterval(devHoldTimer);
        document.getElementById('devTabBtn').style.display = 'block';
        playSound(1000, 0.3, 'sine');
      }
    }, 1000);
  }

  function endDevHold() {
    if (devHoldTimer) clearInterval(devHoldTimer);
    devHoldTimer = null;
  }

  function openDevPanel() {
    playSound(900, 0.2, 'sine');
    alert('Панель разработчика открыта!');
  }

  // === ЗАПУСК ===
  window.onload = function() {
    initSettings();
    renderSlides();
    document.getElementById('pageCounter').textContent = '1 / ' + baseSlides.length;
  };
</script>
</body>
  </html>
