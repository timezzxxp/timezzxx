<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мега-Конспект: Present Simple & Continuous</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Marck+Script&family=Pacifico&family=Press+Start+2P&family=Roboto:wght@300;400;700&family=Russo+One&family=Yeseva+One&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8; 
    --accent: #f59e0b; --accent2: #ef4444; --border: #334155;
    --font-main: 'Segoe UI', system-ui, sans-serif;
  }
  
  body.theme-dark { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8; --border: #334155; }
  body.theme-light { --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --muted: #64748b; --border: #cbd5e1; }
  body.theme-azure { --bg: #0c4a6e; --card: #075985; --text: #e0f2fe; --muted: #bae6fd; --border: #0369a1; }
  body.theme-blue { --bg: #172554; --card: #1e3a8a; --text: #dbeafe; --muted: #bfdbfe; --border: #1d4ed8; }
  body.theme-cyan { --bg: #164e63; --card: #155e75; --text: #cffafe; --muted: #a5f3fc; --border: #0891b2; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-main);
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    transition: background 0.5s ease, color 0.5s ease;
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 4px; }

  .topbar {
    height: 60px; background: var(--card);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; border-bottom: 1px solid var(--border);
    flex-shrink: 0; z-index: 100;
  }
  .topbar h2 { font-size: 1.2em; color: var(--accent); }
  .controls { display: flex; gap: 15px; align-items: center; }
  
  .theme-select {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    padding: 8px 12px; border-radius: 8px; cursor: pointer; font-family: inherit; outline: none;
  }

  /* Двигаемый виджет */
  .draggable-widget {
    position: fixed; top: 80px; right: 20px;
    background: var(--card); border: 1px solid var(--border);
    padding: 15px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    cursor: grab; z-index: 200; display: none; flex-direction: column; gap: 10px;
    width: 240px;
  }
  .draggable-widget:active { cursor: grabbing; }
  .draggable-widget h3 { font-size: 0.9em; color: var(--accent); margin-bottom: 5px; }
  .draggable-widget select {
    width: 100%; padding: 8px; border-radius: 6px; background: var(--bg);
    color: var(--text); border: 1px solid var(--border); font-family: inherit;
  }

  .main-content {
    flex: 1; overflow-y: auto; padding: 30px 20px;
    display: flex; justify-content: center;
  }
  .slide {
    background: var(--card); width: 100%; max-width: 800px;
    padding: 40px; border-radius: 20px; border: 1px solid var(--border);
    display: none; flex-direction: column;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    opacity: 0; transform: translateY(20px);
  }
  .slide.active { 
    display: flex; opacity: 1; transform: translateY(0); 
    animation: slideIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(20px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  h1 {
    font-size: 2.2em; color: var(--accent);
    margin-bottom: 25px; text-align: center;
    border-bottom: 2px dashed var(--border);
    padding-bottom: 15px; cursor: pointer;
  }
  h2 { color: var(--accent); margin-bottom: 15px; font-size: 1.5em; }
  p { font-size: 1.1em; line-height: 1.7; margin-bottom: 15px; }
  ul { margin-left: 25px; margin-bottom: 15px; line-height: 1.7; }
  li { margin-bottom: 8px; }
  
  .example {
    background: var(--bg); padding: 15px; border-radius: 10px;
    border-left: 4px solid var(--accent); margin: 15px 0;
    font-family: monospace; font-size: 1.1em;
  }
  .example.cont { border-left-color: var(--accent2); }

  .nav-bar {
    height: 70px; background: var(--card);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .nav-btn {
    background: var(--accent); color: #fff; border: none; padding: 12px 25px;
    border-radius: 10px; font-size: 1em; cursor: pointer; font-weight: bold;
    transition: 0.3s; font-family: inherit;
  }
  .nav-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(245, 158, 11, 0.4); }
  .nav-btn:disabled { background: var(--muted); cursor: not-allowed; transform: none; box-shadow: none; }
  .page-counter { color: var(--muted); font-weight: bold; font-size: 1.1em; }

  .image-container { display: flex; flex-direction: column; align-items: center; gap: 25px; margin-top: 20px; }
  .image-container img {
    max-width: 100%; max-height: 350px; border-radius: 15px;
    border: 4px solid var(--accent); box-shadow: 0 0 20px rgba(0,0,0,0.3);
  }

  /* Кликер */
  .clicker-area {
    display: flex; flex-direction: column; align-items: center; gap: 20px;
    background: var(--bg); padding: 30px; border-radius: 20px; margin-top: 20px;
    position: relative; overflow: hidden;
  }
  
  .coin-wrapper {
    position: relative; width: 150px; height: 150px;
    display: flex; align-items: center; justify-content: center;
  }
  
  .coin {
    width: 150px; height: 150px; background: radial-gradient(circle at 30% 30%, #fcd34d, #b45309);
    border-radius: 50%; border: 8px solid #78350f; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 2em; font-weight: bold; color: #78350f;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    transition: transform 0.1s, opacity 0.3s;
    user-select: none; position: absolute;
    animation: fallDown 0.4s ease-in forwards;
  }
  
  @keyframes fallDown {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(200px) scale(0.5); opacity: 0; }
  }

  .ball {
    width: 120px; height: 120px; background: radial-gradient(circle at 30% 30%, #f87171, #991b1b);
    border-radius: 50%; border: 6px solid #450a0a; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 3em; box-shadow: 0 0 30px #ef4444;
    animation: ballPulse 1s infinite alternate;
    user-select: none; position: absolute;
  }
  
  @keyframes ballPulse {
    from { transform: scale(1); }
    to { transform: scale(1.05); }
  }

  .score-big { font-size: 2em; color: var(--accent); font-weight: bold; }

  .upgrades-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px; width: 100%; margin-top: 20px;
  }
  .upgrade-card {
    background: var(--card); border: 1px solid var(--border);
    padding: 15px; border-radius: 12px; text-align: center;
  }
  .upgrade-card h4 { color: var(--accent); margin-bottom: 10px; }
  .upgrade-card p { font-size: 0.9em; color: var(--muted); margin-bottom: 10px; }
  .upgrade-btn {
    background: var(--accent2); color: #fff; border: none; padding: 8px 15px;
    border-radius: 8px; cursor: pointer; width: 100%; transition: 0.3s;
    font-family: inherit;
  }
  .upgrade-btn:hover:not(:disabled) { background: #dc2626; }
  .upgrade-btn:disabled { background: var(--muted); cursor: not-allowed; }

  /* Змейка */
  #gameCanvas {
    background: var(--bg); border: 2px solid var(--border);
    border-radius: 10px; display: block; margin: 20px auto;
    box-shadow: 0 0 20px rgba(0,0,0,0.3);
  }
  .snake-header {
    display: flex; justify-content: space-between; width: 400px; margin: 0 auto 10px auto;
    font-weight: bold; font-size: 1.2em;
  }

  /* Оверлеи */
  .overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85); z-index: 9999;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.3s;
  }
  .overlay.show { display: flex; opacity: 1; }
  
  .overlay img {
    max-width: 80%; max-height: 60vh; border-radius: 20px;
    border: 5px solid #ef4444; box-shadow: 0 0 50px #ef4444;
    animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
  
  .overlay h2 {
    color: #f59e0b; font-size: 2em; margin-top: 20px; font-weight: bold;
    text-shadow: 0 0 20px rgba(245, 158, 11, 0.8);
    font-family: 'Russo One', sans-serif;
  }

  /* Экран разбит */
  .screen-cracked::after {
    content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: url('https://i.imgur.com/3N8vM9c.png') center/cover;
    pointer-events: none; z-index: 9000; opacity: 0.7;
    animation: crackFade 5s forwards;
  }
  @keyframes crackFade {
    0% { opacity: 1; }
    80% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* Каллиграфическая надпись */
  .calligraphy-loss {
    font-family: 'Marck Script', cursive; color: #ff0000; font-size: 4em;
    text-shadow: 0 0 20px rgba(255,0,0,0.8); font-weight: bold;
    animation: lossPulse 1s infinite alternate;
  }
  @keyframes lossPulse { from { transform: scale(1); } to { transform: scale(1.05); } }

  /* Страница Создателя */
  .creator-page { text-align: center; padding-top: 20px; }
  .creator-circle {
    width: 250px; height: 250px; border-radius: 50%;
    border: 6px solid #ffffff; box-shadow: 0 0 30px rgba(255,255,255,0.5);
    overflow: hidden; margin: 0 auto 20px auto; display: flex;
    align-items: center; justify-content: center; background: #fff;
  }
  .creator-circle img { width: 100%; height: 100%; object-fit: cover; }
  .creator-text {
    font-family: 'Marck Script', cursive; font-size: 2.2em;
    color: var(--accent); text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    line-height: 1.4; margin-top: 20px;
  }

  .widget-toggle {
    position: fixed; bottom: 90px; right: 20px;
    background: var(--accent); color: #fff; border: none;
    width: 50px; height: 50px; border-radius: 50%;
    font-size: 24px; cursor: pointer; z-index: 300;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    display: flex; align-items: center; justify-content: center;
    transition: 0.3s;
  }
  .widget-toggle:hover { transform: rotate(90deg) scale(1.1); }
</style>
</head>
<body class="theme-dark">

  <div class="topbar">
    <h2>Конспект (Мега-версия)</h2>
    <div class="controls">
      <select class="theme-select" id="themeSelect" onchange="changeTheme(this.value)">
        <option value="theme-dark">🌙 Чёрная</option>
        <option value="theme-light">☀️ Белая</option>
        <option value="theme-azure">💎 Лазурная</option>
        <option value="theme-blue">🌊 Синяя</option>
        <option value="theme-cyan">💧 Голубая</option>
      </select>
    </div>
  </div>

  <button class="widget-toggle" onclick="toggleWidgets()">⚙️</button>
  
  <div class="draggable-widget" id="widgetSettings">
    <h3>🎨 Настройки</h3>
    <label style="font-size: 0.8em; color: var(--muted);">Тема:</label>
    <select onchange="changeTheme(this.value)">
      <option value="theme-dark">Черная</option>
      <option value="theme-light">Белая</option>
      <option value="theme-azure">Лазурная</option>
      <option value="theme-blue">Синяя</option>
      <option value="theme-cyan">Голубая</option>
    </select>
    <label style="font-size: 0.8em; color: var(--muted); margin-top: 5px;">Шрифт:</label>
    <select id="fontSelect" onchange="changeFont(this.value)">
      <option value="'Segoe UI', sans-serif">Segoe UI</option>
      <option value="'Comfortaa', cursive">Comfortaa</option>
      <option value="'Marck Script', cursive">Marck Script</option>
      <option value="'Pacifico', cursive">Pacifico</option>
      <option value="'Press Start 2P', cursive">Press Start 2P</option>
      <option value="'Roboto', sans-serif">Roboto</option>
      <option value="'Russo One', sans-serif">Russo One</option>
      <option value="'Yeseva One', serif">Yeseva One</option>
      <option value="'Courier New', monospace">Courier New</option>
      <option value="Georgia, serif">Georgia</option>
      <option value="'Times New Roman', serif">Times New Roman</option>
      <option value="Arial, sans-serif">Arial</option>
      <option value="Verdana, sans-serif">Verdana</option>
      <option value="Tahoma, sans-serif">Tahoma</option>
      <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
      <option value="Impact, sans-serif">Impact</option>
      <option value="'Comic Sans MS', cursive">Comic Sans</option>
      <option value="'Brush Script MT', cursive">Brush Script</option>
      <option value="'Palatino Linotype', serif">Palatino</option>
      <option value="'Lucida Console', monospace">Lucida Console</option>
    </select>
  </div>

  <div class="main-content" id="contentArea"></div>

  <div class="nav-bar">
    <button class="nav-btn" id="prevBtn" onclick="changeSlide(-1)">← Назад</button>
    <span class="page-counter" id="pageCounter">1 / 24</span>
    <button class="nav-btn" id="nextBtn" onclick="changeSlide(1)">Вперед →</button>
  </div>

  <div id="hogOverlay" class="overlay" onclick="hideHog()">
    <img src="pig_face.jpg" alt="Хряк">
    <h2>ПОЗДРАВЛЯЮ ВЫ ВЫБИЛИ ХРЯКА!</h2>
  </div>

<script>
  // === НАСТРОЙКИ ===
  function changeTheme(themeName) {
    document.body.className = themeName;
    document.getElementById('themeSelect').value = themeName;
  }
  function changeFont(fontName) {
    document.documentElement.style.setProperty('--font-main', fontName);
  }

  // === ПЕРЕТАСКИВАНИЕ ===
  let widgetVisible = false;
  function toggleWidgets() {
    widgetVisible = !widgetVisible;
    document.getElementById('widgetSettings').style.display = widgetVisible ? 'flex' : 'none';
  }
  const widget = document.getElementById('widgetSettings');
  let isDragging = false, offsetX, offsetY;
  widget.addEventListener('mousedown', (e) => {
    isDragging = true;
    offsetX = e.clientX - widget.getBoundingClientRect().left;
    offsetY = e.clientY - widget.getBoundingClientRect().top;
  });
  document.addEventListener('mousemove', (e) => {
    if (isDragging) {
      widget.style.left = (e.clientX - offsetX) + 'px';
      widget.style.top = (e.clientY - offsetY) + 'px';
      widget.style.right = 'auto';
    }
  });
  document.addEventListener('mouseup', () => { isDragging = false; });

  // === СТРАНИЦЫ ===
  const baseSlides = [
    { ru: { title: "Present Simple и Present Continuous", body: "<p style='text-align:center; margin-top:20px;'>Добро пожаловать!</p>" }, en: { title: "Present Simple and Present Continuous", body: "<p>Welcome!</p>" } },
    { ru: { title: "Что такое Present Simple?", body: "<p>Действия <b>регулярно</b> или <b>факты</b>.</p><ul><li>Привычки (I wake up at 7 am).</li><li>Факты (The sun rises in the east).</li></ul>" }, en: { title: "What is Present Simple?", body: "<p>Actions <b>regularly</b> or <b>facts</b>.</p>" } },
    { ru: { title: "Образование Present Simple", body: "<ul><li><b>Утверждение:</b> Subject + Verb (+s/es).</li><li><b>Отрицание:</b> Subject + do/does not + Verb.</li></ul>" }, en: { title: "Present Simple Form", body: "<ul><li><b>Positive:</b> Subject + Verb (+s/es).</li></ul>" } },
    { ru: { title: "Маркеры Present Simple", body: "<ul><li><b>always</b></li><li><b>usually</b></li><li><b>every day</b></li></ul>" }, en: { title: "Present Simple Markers", body: "<ul><li><b>always</b></li><li><b>usually</b></li><li><b>every day</b></li></ul>" } },
    { ru: { title: "Что такое Present Continuous?", body: "<p>Действия <b>прямо сейчас</b>.</p><ul><li>I am reading now.</li></ul>" }, en: { title: "What is Present Continuous?", body: "<p>Actions <b>right now</b>.</p>" } },
    { ru: { title: "Образование Present Continuous", body: "<ul><li><b>Утверждение:</b> Subject + am/is/are + Verb+ing.</li></ul>" }, en: { title: "Present Continuous Form", body: "<ul><li><b>Positive:</b> Subject + am/is/are + Verb+ing.</li></ul>" } },
    { ru: { title: "Маркеры Present Continuous", body: "<ul><li><b>now</b></li><li><b>at the moment</b></li></ul>" }, en: { title: "Present Continuous Markers", body: "<ul><li><b>now</b></li><li><b>at the moment</b></li></ul>" } },
    { ru: { title: "Сравнение времен", body: "<table><tr><th>Simple</th><th>Continuous</th></tr><tr><td>I work every day.</td><td>I am working now.</td></tr></table>" }, en: { title: "Tense Comparison", body: "<table><tr><th>Simple</th><th>Continuous</th></tr><tr><td>I work every day.</td><td>I am working now.</td></tr></table>" } },
    { ru: { title: "Stative Verbs", body: "<p>Глаголы чувств: like, love, know.</p>" }, en: { title: "Stative Verbs", body: "<p>Feelings: like, love, know.</p>" } },
    { ru: { title: "Исключения", body: "<p>have / having lunch.</p>" }, en: { title: "Exceptions", body: "<p>have / having lunch.</p>" } },
    { ru: { title: "Правило -ing", body: "<p>play -> playing, make -> making.</p>" }, en: { title: "-ing Rules", body: "<p>play -> playing, make -> making.</p>" } },
    { ru: { title: "Отрицание", body: "<p>I don't like / I am not reading.</p>" }, en: { title: "Negatives", body: "<p>I don't like / I am not reading.</p>" } },
    { ru: { title: "Вопросы", body: "<p>Do you like? / Are you reading?</p>" }, en: { title: "Questions", body: "<p>Do you like? / Are you reading?</p>" } },
    { ru: { title: "Наречия частоты", body: "<p>I always drink coffee.</p>" }, en: { title: "Adverbs", body: "<p>I always drink coffee.</p>" } },
    { ru: { title: "Доп 1", body: "<p>To be: am/is/are.</p>" }, en: { title: "Extra 1", body: "<p>To be: am/is/are.</p>" } },
    { ru: { title: "Доп 2", body: "<p>I am reading a book now.</p>" }, en: { title: "Extra 2", body: "<p>I am reading a book now.</p>" } },
    { ru: { title: "Доп 3", body: "<p>Simple = рутина, Continuous = процесс.</p>" }, en: { title: "Extra 3", body: "<p>Simple = routine, Continuous = process.</p>" } },
    { ru: { title: "Доп 4", body: "<p>Нельзя I am knowing. Только I know.</p>" }, en: { title: "Extra 4", body: "<p>Don't say I am knowing. Say I know.</p>" } },
    { ru: { title: "Доп 5", body: "<p>Повторите правила и переходите к играм!</p>" }, en: { title: "Extra 5", body: "<p>Review rules!</p>" } },
    { ru: { title: "Пасхалка!", body: "<p style='text-align:center;'>Нажми на заголовок 3 раза!</p>" }, en: { title: "Easter Egg!", body: "<p style='text-align:center;'>Click title 3 times!</p>" } },
    { ru: { title: "Кликер: Монетка", body: "<div class='clicker-area'><div class='score-big' id='scoreDisplay'>0</div><div class='coin-wrapper' id='coinWrapper'><div class='coin' id='coinBtn' onclick='clickCoin()'>💰</div></div><div class='upgrades-grid'><div class='upgrade-card'><h4>Сила клика</h4><p>+1 клик</p><p>Цена: <span id='costClick'>15</span></p><button class='upgrade-btn' id='btnClick' onclick='buyUpgrade(1)'>Купить (ур. 1/10)</button></div><div class='upgrade-card'><h4>Автокликер</h4><p>+1 в сек</p><p>Цена: <span id='costAuto'>50</span></p><button class='upgrade-btn' id='btnAuto' onclick='buyUpgrade(2)'>Купить (ур. 0)</button></div><div class='upgrade-card'><h4>Множитель</h4><p>x2 к клику</p><p>Цена: <span id='costMult'>100</span></p><button class='upgrade-btn' id='btnMult' onclick='buyUpgrade(3)'>Купить (ур. 1/10)</button></div></div></div>" }, en: { title: "Clicker", body: "..." } },
    { ru: { title: "Создатель", body: "<div class='creator-page'><div class='creator-circle'><img src='anime.jpg' alt='Anime'></div><div class='creator-text'>Создатель этого проекта<br>Магдеев Тимур (Термометр)</div></div>" }, en: { title: "Creator", body: "..." } },
    { ru: { title: "Змейка", body: "<div style='text-align:center;'><div class='snake-header'><span>Счет: <span id='snakeScore'>0</span></span><span>Рекорд: <span id='snakeRecord'>0</span></span></div><canvas id='gameCanvas' width='400' height='400'></canvas><button class='nav-btn' onclick='startSnake()' style='margin-top:10px;'>Начать заново</button></div>" }, en: { title: "Snake", body: "..." } },
    { ru: { title: "Бонусные картинки", body: "<div class='image-container'><img src='meme.jpg'><img src='pig_bike.jpg'><img src='totya.jpg'></div>" }, en: { title: "Bonus Images", body: "..." } }
  ];

  let currentSlide = 0;
  let clickCount = 0;
  let record = localStorage.getItem('snakeRecord') || 0;

  function renderSlides() {
    const area = document.getElementById('contentArea');
    area.innerHTML = '';
    baseSlides.forEach((slide, index) => {
      const div = document.createElement('div');
      div.className = 'slide' + (index === currentSlide ? ' active' : '');
      div.id = 'slide-' + index;
      
      const isEasterEgg = (index === 19);
      const titleAttr = isEasterEgg ? "onclick='handleEggClick()'" : "";
      
      div.innerHTML = `<h1 ${titleAttr}>${slide.ru.title}</h1><div>${slide.ru.body}</div>`;
      area.appendChild(div);
    });
  }

  function changeSlide(dir) {
    currentSlide += dir;
    if (currentSlide < 0) currentSlide = 0;
    if (currentSlide >= baseSlides.length) currentSlide = baseSlides.length - 1;
    
    document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
    const active = document.getElementById('slide-' + currentSlide);
    if (active) active.classList.add('active');
    
    document.getElementById('prevBtn').disabled = currentSlide === 0;
    document.getElementById('nextBtn').disabled = currentSlide === baseSlides.length - 1;
    document.getElementById('pageCounter').textContent = (currentSlide + 1) + ' / ' + baseSlides.length;
    document.getElementById('contentArea').scrollTop = 0;

    if (currentSlide === 20) initClicker();
    if (currentSlide === 22) startSnake();
  }

  // Пасхалка
  function handleEggClick() {
    clickCount++;
    clearTimeout(window.eggTimer);
    if (clickCount === 3) {
      document.getElementById('hogOverlay').classList.add('show');
      clickCount = 0;
    } else {
      window.eggTimer = setTimeout(() => clickCount = 0, 600);
    }
  }
  function hideHog() {
    document.getElementById('hogOverlay').classList.remove('show');
  }

  // === КЛИКЕР ===
  let score = 0;
  let cPower = 1, cCost = 15, cLvl = 1;
  let aPower = 0, aCost = 50, aLvl = 0;
  let mPower = 1, mCost = 100, mLvl = 1;
  let isBall = false;
  let ballClicks = 0;

  function initClicker() {
    const wrapper = document.getElementById('coinWrapper');
    if (wrapper) {
      wrapper.innerHTML = '<div class="coin" id="coinBtn" onclick="clickCoin()">💰</div>';
      isBall = false;
      ballClicks = 0;
    }
    updateClickerUI();
  }

  function clickCoin() {
    if (isBall) {
      ballClicks++;
      if (ballClicks === 3) {
        document.getElementById('hogOverlay').innerHTML = '<h2 style="color:#ff0000; font-family:\'Marck Script\', cursive; font-size:4em;">Ты не должен был меня найтиии!</h2>';
        document.getElementById('hogOverlay').classList.add('show');
        resetGame();
      }
      return;
    }

    if (Math.random() < 0.02) {
      // 2% шанс разбить экран
      document.body.classList.add('screen-cracked');
      setTimeout(() => {
        document.body.classList.remove('screen-cracked');
        const wrapper = document.getElementById('coinWrapper');
        wrapper.innerHTML = '<div class="ball" id="ballBtn" onclick="clickCoin()">⚽</div>';
        isBall = true;
        ballClicks = 0;
      }, 5000);
      return;
    }

    score += cPower * mPower;
    updateClickerUI();
    
    // Анимация падения
    const coin = document.getElementById('coinBtn');
    if (coin) {
      coin.style.animation = 'none';
      coin.offsetHeight;
      coin.style.animation = 'fallDown 0.4s ease-in forwards';
      setTimeout(() => {
        coin.style.animation = 'none';
        coin.style.transform = 'translateY(0) scale(1)';
        coin.style.opacity = '1';
      }, 400);
    }

    if (Math.random() < 0.34) {
      document.getElementById('hogOverlay').classList.add('show');
    }
  }

  function resetGame() {
    score = 0; cPower = 1; cCost = 15; cLvl = 1;
    aPower = 0; aCost = 50; aLvl = 0;
    mPower = 1; mCost = 100; mLvl = 1;
    updateClickerUI();
    document.getElementById('hogOverlay').innerHTML = '<img src="pig_face.jpg"><h2>ПОЗДРАВЛЯЮ ВЫ ВЫБИЛИ ХРЯКА!</h2>';
  }

  function buyUpgrade(type) {
    if (type === 1 && cLvl < 10 && score >= cCost) {
      score -= cCost; cPower++; cLvl++; cCost *= 2;
    } else if (type === 2 && score >= aCost) {
      score -= aCost; aPower++; aLvl++; aCost *= 2;
    } else if (type === 3 && mLvl < 10 && score >= mCost) {
      score -= mCost; mPower *= 2; mLvl++; mCost *= 2;
    }
    updateClickerUI();
  }

  function updateClickerUI() {
    const s = document.getElementById('scoreDisplay');
    if (s) s.textContent = score;
    const c1 = document.getElementById('costClick');
    if (c1) c1.textContent = cCost;
    const c2 = document.getElementById('costAuto');
    if (c2) c2.textContent = aCost;
    const c3 = document.getElementById('costMult');
    if (c3) c3.textContent = mCost;
    
    const b1 = document.getElementById('btnClick');
    if (b1) { b1.textContent = `Купить (ур. ${cLvl}/10)`; b1.disabled = score < cCost || cLvl >= 10; }
    const b2 = document.getElementById('btnAuto');
    if (b2) { b2.textContent = `Купить (ур. ${aLvl})`; b2.disabled = score < aCost; }
    const b3 = document.getElementById('btnMult');
    if (b3) { b3.textContent = `Купить (ур. ${mLvl}/10)`; b3.disabled = score < mCost || mLvl >= 10; }
  }

  setInterval(() => {
    if (aPower > 0) { score += aPower; updateClickerUI(); }
  }, 1000);

  // === ЗМЕЙКА ===
  let snakeCanvas, snakeCtx, snake, snakeDir, food, gameLoop;
  let snakeX = 10, snakeY = 10, targetX = 10, targetY = 10;

  function startSnake() {
    snakeCanvas = document.getElementById('gameCanvas');
    if (!snakeCanvas) return;
    snakeCtx = snakeCanvas.getContext('2d');
    snake = [{x: 10, y: 10}];
    snakeDir = {x: 0, y: 0};
    targetX = 10; targetY = 10;
    document.getElementById('snakeScore').textContent = 0;
    document.getElementById('snakeRecord').textContent = record;
    placeFood();
    clearInterval(gameLoop);
    gameLoop = setInterval(snakeUpdate, 120);
    
    document.addEventListener('keydown', handleKey);
    snakeCanvas.addEventListener('touchstart', handleTouch);
  }

  function placeFood() {
    food = {
      x: Math.floor(Math.random() * 20),
      y: Math.floor(Math.random() * 20)
    };
  }

  function handleKey(e) {
    if (currentSlide !== 22) return;
    if (e.key === 'ArrowUp' && snakeDir.y === 0) snakeDir = {x: 0, y: -1};
    if (e.key === 'ArrowDown' && snakeDir.y === 0) snakeDir = {x: 0, y: 1};
    if (e.key === 'ArrowLeft' && snakeDir.x === 0) snakeDir = {x: -1, y: 0};
    if (e.key === 'ArrowRight' && snakeDir.x === 0) snakeDir = {x: 1, y: 0};
  }

  let touchStartX = 0, touchStartY = 0;
  function handleTouch(e) {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    e.preventDefault();
  }
  document.addEventListener('touchend', (e) => {
    if (currentSlide !== 22) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx > 30 && snakeDir.x === 0) snakeDir = {x: 1, y: 0};
      if (dx < -30 && snakeDir.x === 0) snakeDir = {x: -1, y: 0};
    } else {
      if (dy > 30 && snakeDir.y === 0) snakeDir = {x: 0, y: 1};
      if (dy < -30 && snakeDir.y === 0) snakeDir = {x: 0, y: -1};
    }
  });

  function snakeUpdate() {
    if (!snakeCanvas || currentSlide !== 22) return;
    
    targetX += snakeDir.x;
    targetY += snakeDir.y;
    
    if (targetX < 0 || targetX >= 20 || targetY < 0 || targetY >= 20) {
      gameOver();
      return;
    }
    
    for (let i = 0; i < snake.length; i++) {
      if (snake[i].x === targetX && snake[i].y === targetY) {
        gameOver();
        return;
      }
    }
    
    snake.unshift({x: targetX, y: targetY});
    
    if (targetX === food.x && targetY === food.y) {
      document.getElementById('snakeScore').textContent = snake.length - 1;
      if (snake.length - 1 > record) {
        record = snake.length - 1;
        localStorage.setItem('snakeRecord', record);
        document.getElementById('snakeRecord').textContent = record;
      }
      placeFood();
    } else {
      snake.pop();
    }
    
    drawSnake();
  }

  function drawSnake() {
    snakeCtx.fillStyle = '#0f172a';
    snakeCtx.fillRect(0, 0, 400, 400);
    
    snakeCtx.fillStyle = '#ef4444';
    snakeCtx.beginPath();
    snakeCtx.arc(food.x * 20 + 10, food.y * 20 + 10, 8, 0, Math.PI * 2);
    snakeCtx.fill();
    
    snake.forEach((seg, i) => {
      snakeCtx.fillStyle = i === 0 ? '#f59e0b' : '#fcd34d';
      snakeCtx.fillRect(seg.x * 20 + 1, seg.y * 20 + 1, 18, 18);
    });
  }

  function gameOver() {
    clearInterval(gameLoop);
    document.getElementById('hogOverlay').innerHTML = '<h2 class="calligraphy-loss">ВЫ ПРОИГРАЛИ</h2>';
    document.getElementById('hogOverlay').classList.add('show');
  }

  window.onload = function() {
    renderSlides();
    document.getElementById('pageCounter').textContent = '1 / ' + baseSlides.length;
  };
</script>
</body>
  </html>
