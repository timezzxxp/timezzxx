<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Версия 5.6 | Мега-Конспект</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Marck+Script&family=Pacifico&family=Press+Start+2P&family=Roboto:wght@300;400;700&family=Russo+One&family=Yeseva+One&family=Lobster&family=Playfair+Display:wght@400;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8; 
    --accent: #f59e0b; --accent2: #ef4444; --border: #334155;
    --font-main: 'Segoe UI', system-ui, sans-serif;
    --bubble-bg: #1e293b;
    --anim-speed: 0.05s;
    --anim-style: 'anim-typewriter';
    --zoom-level: 1;
    --verity-color: #991b1b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: var(--font-main);
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh; height: 100dvh;
    overflow: hidden;
    transition: background 0.3s ease, color 0.3s ease;
    user-select: none;
    font-size: calc(16px * var(--zoom-level));
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 3px; }

  .topbar {
    height: 50px; background: var(--card);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 10px; border-bottom: 1px solid var(--border);
    flex-shrink: 0; z-index: 100;
  }
  .topbar h2 { font-size: 0.85em; color: var(--accent); }
  .topbar .version { font-size: 0.7em; color: var(--muted); margin-left: 5px; font-weight: normal; }
  .controls { display: flex; gap: 8px; align-items: center; }
  
  .theme-select, .lang-select {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    padding: 4px 6px; border-radius: 6px; cursor: pointer; font-family: inherit; outline: none;
    font-size: 0.75em; max-width: 120px;
  }

  .draggable-widget {
    position: fixed; top: 60px; right: 5px; left: auto;
    background: var(--card); border: 1px solid var(--border);
    padding: 10px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    cursor: grab; z-index: 200; display: none; flex-direction: column; gap: 8px;
    width: 280px; max-width: 90vw; max-height: 80vh; overflow-y: auto;
  }
  .draggable-widget:active { cursor: grabbing; }
  .draggable-widget h3 { font-size: 0.8em; color: var(--accent); margin-bottom: 3px; }
  .draggable-widget select, .draggable-widget input[type="color"], .draggable-widget input[type="range"] {
    width: 100%; padding: 6px; border-radius: 4px; background: var(--bg);
    color: var(--text); border: 1px solid var(--border); font-family: inherit;
    font-size: 0.8em;
  }

  .main-content {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 15px 10px; display: flex; justify-content: center;
    -webkit-overflow-scrolling: touch;
  }
  .slide {
    background: var(--card); width: 100%; max-width: 800px;
    padding: 20px; border-radius: 15px; border: 1px solid var(--border);
    display: none; flex-direction: column;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    opacity: 0; transform: translateY(20px);
  }
  .slide.active { 
    display: flex; opacity: 1; transform: translateY(0); 
    animation: slideIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(20px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  h1 {
    font-size: 1.4em; color: var(--accent);
    margin-bottom: 15px; text-align: center;
    border-bottom: 2px dashed var(--border);
    padding-bottom: 10px; cursor: pointer;
  }
  h2 { color: var(--accent); margin-bottom: 10px; font-size: 1.1em; }
  p { font-size: 0.95em; line-height: 1.6; margin-bottom: 10px; }
  ul { margin-left: 20px; margin-bottom: 10px; line-height: 1.6; font-size: 0.95em; }
  li { margin-bottom: 5px; }
  
  .example {
    background: var(--bg); padding: 10px; border-radius: 8px;
    border-left: 4px solid var(--accent); margin: 10px 0;
    font-family: monospace; font-size: 0.95em;
  }
  .example.cont { border-left-color: var(--accent2); }

  .nav-bar {
    height: 60px; background: var(--card);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 10px; border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .nav-btn {
    background: var(--accent); color: #fff; border: none; padding: 8px 15px;
    border-radius: 8px; font-size: 0.9em; cursor: pointer; font-weight: bold;
    transition: 0.3s; font-family: inherit;
  }
  .nav-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
  .nav-btn:disabled { background: var(--muted); cursor: not-allowed; transform: none; box-shadow: none; }
  .page-counter { color: var(--muted); font-weight: bold; font-size: 0.9em; }

  .image-container { display: flex; flex-direction: column; align-items: center; gap: 15px; margin-top: 10px; }
  .image-container img {
    max-width: 100%; max-height: 250px; border-radius: 10px;
    border: 3px solid var(--accent); box-shadow: 0 0 15px rgba(0,0,0,0.3);
  }

  .clicker-area {
    display: flex; flex-direction: column; align-items: center; gap: 15px;
    background: var(--bg); padding: 15px; border-radius: 15px; margin-top: 10px;
    position: relative; overflow: hidden; width: 100%;
  }
  
  .coin-wrapper {
    position: relative; width: 150px; height: 200px;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
  }
  
  .verity-title {
    font-size: 1.2em; color: var(--accent); font-weight: bold;
    margin-bottom: 5px; text-align: center;
  }

  .coin {
    width: 120px; height: 120px; background: radial-gradient(circle at 30% 30%, #fcd34d, #b45309);
    border-radius: 50%; border: 6px solid #78350f; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5em; font-weight: bold; color: #78350f;
    box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    transition: transform 0.1s, opacity 0.3s;
    user-select: none; position: absolute;
  }
  
  .ball {
    width: 120px; height: 120px; background: radial-gradient(circle at 30% 30%, #f87171, var(--verity-color));
    border-radius: 50%; border: 6px solid #450a0a; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 0 25px #ef4444;
    animation: ballPulse 1s infinite alternate;
    user-select: none; position: relative; transition: all 0.3s;
  }
  
  .ball-eyes { display: flex; gap: 15px; margin-bottom: 5px; }
  .eye { width: 20px; height: 20px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .pupil { width: 8px; height: 8px; background: black; border-radius: 50%; }
  .mouth { width: 30px; height: 15px; border-bottom: 4px solid #450a0a; border-radius: 0 0 15px 15px; }

  @keyframes ballPulse { from { transform: scale(1); } to { transform: scale(1.05); } }

  .monster {
    width: 150px; height: 300px;
    background: radial-gradient(circle at 30% 30%, #f87171, var(--verity-color));
    border-radius: 50% 50% 10% 10%;
    border: 6px solid #450a0a;
    box-shadow: 0 0 40px #ef4444;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; animation: monsterGrow 0.5s ease-out;
  }
  @keyframes monsterGrow {
    from { transform: scaleY(0.5); opacity: 0; }
    to { transform: scaleY(1); opacity: 1; }
  }

  .speech-bubble {
    position: absolute; top: -80px; left: 50%; transform: translateX(-50%);
    background: var(--bubble-bg); color: var(--text);
    padding: 10px 15px; border-radius: 15px;
    font-size: 0.85em; text-align: center; width: 250px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    z-index: 10;
    border: 2px solid var(--accent);
    transition: background 0.5s, border-color 0.5s;
    font-family: var(--font-main);
    min-height: 50px;
    display: flex; align-items: center; justify-content: center;
  }
  .speech-bubble::after {
    content: ''; position: absolute; bottom: -10px; left: 50%;
    transform: translateX(-50%); border-width: 10px 10px 0;
    border-style: solid; border-color: var(--bubble-bg) transparent transparent transparent;
  }

  .score-big { font-size: 1.5em; color: var(--accent); font-weight: bold; }

  .upgrades-grid {
    display: grid; grid-template-columns: 1fr;
    gap: 10px; width: 100%; margin-top: 10px;
  }
  .upgrade-card {
    background: var(--card); border: 1px solid var(--border);
    padding: 10px; border-radius: 10px; text-align: center;
  }
  .upgrade-card h4 { color: var(--accent); margin-bottom: 5px; font-size: 0.9em; }
  .upgrade-card p { font-size: 0.8em; color: var(--muted); margin-bottom: 5px; }
  .upgrade-btn {
    background: var(--accent2); color: #fff; border: none; padding: 8px 12px;
    border-radius: 6px; cursor: pointer; width: 100%; transition: 0.3s;
    font-family: inherit; font-size: 0.85em;
  }
  .upgrade-btn:hover:not(:disabled) { background: #dc2626; }
  .upgrade-btn:disabled { background: var(--muted); cursor: not-allowed; }

  #gameCanvas {
    background: var(--bg); border: 2px solid var(--border);
    border-radius: 8px; display: block; margin: 10px auto;
    box-shadow: 0 0 15px rgba(0,0,0,0.3);
    max-width: 100%; height: auto;
  }
  .snake-header {
    display: flex; justify-content: space-between; width: 100%; max-width: 400px; margin: 0 auto 10px auto;
    font-weight: bold; font-size: 1em;
  }

  .overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.9); z-index: 9999;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.3s; padding: 20px; text-align: center;
  }
  .overlay.show { display: flex; opacity: 1; }
  
  .overlay img {
    max-width: 80%; max-height: 50vh; border-radius: 15px;
    border: 4px solid #ef4444; box-shadow: 0 0 40px #ef4444;
    animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
  
  .overlay h2 {
    color: #f59e0b; font-size: 1.5em; margin-top: 15px; font-weight: bold;
    text-shadow: 0 0 20px rgba(245, 158, 11, 0.8);
    font-family: 'Russo One', sans-serif;
  }

  .calligraphy-loss {
    font-family: 'Marck Script', cursive; color: #ff0000; font-size: 3em;
    text-shadow: 0 0 20px rgba(255,0,0,0.8); font-weight: bold;
    animation: lossPulse 1s infinite alternate;
  }
  @keyframes lossPulse { from { transform: scale(1); } to { transform: scale(1.05); } }

  .screen-cracked::before {
    content: '';
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: 
      linear-gradient(30deg, transparent 48%, rgba(255,255,255,0.9) 49%, rgba(255,255,255,0.9) 51%, transparent 52%),
      linear-gradient(-30deg, transparent 48%, rgba(255,255,255,0.8) 49%, rgba(255,255,255,0.8) 51%, transparent 52%),
      linear-gradient(60deg, transparent 49.5%, rgba(255,255,255,0.85) 50%, rgba(255,255,255,0.85) 50.5%, transparent 51%),
      linear-gradient(-60deg, transparent 49.5%, rgba(255,255,255,0.75) 50%, rgba(255,255,255,0.75) 50.5%, transparent 51%);
    pointer-events: none;
    z-index: 9998;
    animation: crackShow 10s forwards;
    opacity: 0.9;
  }
  @keyframes crackShow {
    0% { opacity: 1; }
    90% { opacity: 1; }
    100% { opacity: 0; }
  }

  .creator-page { text-align: center; padding-top: 10px; }
  .creator-circle {
    width: 180px; height: 180px; border-radius: 50%;
    border: 5px solid #ffffff; box-shadow: 0 0 25px rgba(255,255,255,0.5);
    overflow: hidden; margin: 0 auto 15px auto; display: flex;
    align-items: center; justify-content: center; background: #fff;
  }
  .creator-circle img { width: 100%; height: 100%; object-fit: cover; }
  .creator-text {
    font-family: 'Marck Script', cursive; font-size: 1.5em;
    color: var(--accent); text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    line-height: 1.4; margin-top: 10px;
  }

  .widget-toggle {
    position: fixed; bottom: 75px; right: 15px;
    background: var(--accent); color: #fff; border: none;
    width: 45px; height: 45px; border-radius: 50%;
    font-size: 14px; cursor: pointer; z-index: 300;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    display: flex; align-items: center; justify-content: center;
    transition: 0.3s;
  }
  .widget-toggle:hover { transform: rotate(90deg) scale(1.1); }

  /* Анимации для текста */
  .anim-typewriter { overflow: hidden; white-space: nowrap; border-right: 2px solid; animation: typing var(--anim-speed) steps(30, end), blink-caret .75s step-end infinite; }
  @keyframes typing { from { width: 0; } to { width: 100%; } }
  @keyframes blink-caret { from, to { border-color: transparent; } 50% { border-color: var(--accent); } }

  .anim-fade { animation: fadeIn var(--anim-speed) ease-in forwards; opacity: 0; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .anim-slide-up { animation: slideUp var(--anim-speed) ease-out forwards; opacity: 0; transform: translateY(20px); }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  .anim-slide-down { animation: slideDown var(--anim-speed) ease-out forwards; opacity: 0; transform: translateY(-20px); }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

  .anim-slide-left { animation: slideLeft var(--anim-speed) ease-out forwards; opacity: 0; transform: translateX(20px); }
  @keyframes slideLeft { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

  .anim-slide-right { animation: slideRight var(--anim-speed) ease-out forwards; opacity: 0; transform: translateX(-20px); }
  @keyframes slideRight { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }

  .anim-scale-up { animation: scaleUp var(--anim-speed) ease-out forwards; opacity: 0; transform: scale(0.5); }
  @keyframes scaleUp { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }

  .anim-scale-down { animation: scaleDown var(--anim-speed) ease-out forwards; opacity: 0; transform: scale(1.5); }
  @keyframes scaleDown { from { opacity: 0; transform: scale(1.5); } to { opacity: 1; transform: scale(1); } }

  .anim-rotate { animation: rotateIn var(--anim-speed) ease-out forwards; opacity: 0; transform: rotate(-180deg); }
  @keyframes rotateIn { from { opacity: 0; transform: rotate(-180deg); } to { opacity: 1; transform: rotate(0); } }

  .anim-bounce { animation: bounceIn var(--anim-speed) ease-out forwards; opacity: 0; }
  @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.3); } 50% { opacity: 1; transform: scale(1.05); } 70% { transform: scale(0.9); } 100% { transform: scale(1); } }

  .anim-flip { animation: flipIn var(--anim-speed) ease-out forwards; opacity: 0; transform: perspective(400px) rotateY(90deg); }
  @keyframes flipIn { from { opacity: 0; transform: perspective(400px) rotateY(90deg); } to { opacity: 1; transform: perspective(400px) rotateY(0); } }

  .anim-zoom { animation: zoomIn var(--anim-speed) ease-out forwards; opacity: 0; transform: scale(2); }
  @keyframes zoomIn { from { opacity: 0; transform: scale(2); } to { opacity: 1; transform: scale(1); } }

  .anim-blur { animation: blurIn var(--anim-speed) ease-out forwards; opacity: 0; filter: blur(10px); }
  @keyframes blurIn { from { opacity: 0; filter: blur(10px); } to { opacity: 1; filter: blur(0); } }

  .anim-flip-x { animation: flipXIn var(--anim-speed) ease-out forwards; opacity: 0; transform: rotateX(90deg); }
  @keyframes flipXIn { from { opacity: 0; transform: rotateX(90deg); } to { opacity: 1; transform: rotateX(0); } }

  .anim-roll { animation: rollIn var(--anim-speed) ease-out forwards; opacity: 0; transform: translateX(-50px) rotate(-90deg); }
  @keyframes rollIn { from { opacity: 0; transform: translateX(-50px) rotate(-90deg); } to { opacity: 1; transform: translateX(0) rotate(0); } }

  .anim-drop { animation: dropIn var(--anim-speed) ease-out forwards; opacity: 0; transform: translateY(-50px); }
  @keyframes dropIn { from { opacity: 0; transform: translateY(-50px); } to { opacity: 1; transform: translateY(0); } }

  .anim-swing { animation: swingIn var(--anim-speed) ease-out forwards; opacity: 0; transform-origin: top center; }
  @keyframes swingIn { 0% { opacity: 0; transform: rotate(15deg); } 100% { opacity: 1; transform: rotate(0); } }

  .anim-fade-up { animation: fadeUpIn var(--anim-speed) ease-out forwards; opacity: 0; transform: translateY(10px); }
  @keyframes fadeUpIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .anim-fade-down { animation: fadeDownIn var(--anim-speed) ease-out forwards; opacity: 0; transform: translateY(-10px); }
  @keyframes fadeDownIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

  .anim-pulse { animation: pulseIn var(--anim-speed) ease-out forwards; opacity: 0; }
  @keyframes pulseIn { 0% { opacity: 0; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.1); } 100% { transform: scale(1); } }

  @media (max-width: 400px) {
    .topbar h2 { font-size: 0.75em; }
    .topbar .version { display: none; }
    .theme-select, .lang-select { font-size: 0.7em; }
    .nav-btn { padding: 6px 10px; font-size: 0.8em; }
  }
</style>
</head>
<body class="theme-dark">

  <div class="topbar">
    <h2>Мега-Конспект <span class="version">Версия 5.6</span></h2>
    <div class="controls">
      <select class="lang-select" id="langSelect" onchange="changeLang(this.value)">
        <option value="ru">RU Русский</option>
        <option value="en">EN English</option>
        <option value="es">ES Español</option>
        <option value="de">DE Deutsch</option>
        <option value="fr">FR Français</option>
        <option value="it">IT Italiano</option>
        <option value="pt">PT Português</option>
        <option value="zh">ZH 中文</option>
        <option value="ja">JA 日本語</option>
        <option value="ko">KO 한국어</option>
        <option value="ar">AR العربية</option>
        <option value="tr">TR Türkçe</option>
        <option value="pl">PL Polski</option>
        <option value="uk">UK Українська</option>
        <option value="sv">SV Svenska</option>
        <option value="no">NO Norsk</option>
        <option value="da">DA Dansk</option>
        <option value="fi">FI Suomi</option>
        <option value="cs">CS Čeština</option>
        <option value="sk">SK Slovenčina</option>
        <option value="hu">HU Magyar</option>
        <option value="ro">RO Română</option>
        <option value="bg">BG Български</option>
        <option value="el">EL Ελληνικά</option>
        <option value="he">HE עברית</option>
        <option value="hi">HI हिन्दी</option>
        <option value="id">ID Bahasa</option>
        <option value="ms">MS Melayu</option>
        <option value="th">TH ไทย</option>
        <option value="vi">VI Tiếng Việt</option>
        <option value="nl">NL Nederlands</option>
        <option value="is">IS Íslenska</option>
        <option value="ga">GA Gaeilge</option>
        <option value="cy">CY Cymraeg</option>
        <option value="sr">SR Српски</option>
        <option value="hr">HR Hrvatski</option>
        <option value="tt">TT Татарча</option>
        <option value="ba">BA Башҡортса</option>
      </select>
      <select class="theme-select" id="themeSelect" onchange="changeTheme(this.value)"></select>
    </div>
  </div>

  <button class="widget-toggle" onclick="toggleWidgets()">Настройки</button>
  
  <div class="draggable-widget" id="widgetSettings">
    <h3>Настройки</h3>
    <label style="font-size: 0.7em; color: var(--muted);">Тема:</label>
    <select id="themeSelectWidget" onchange="changeTheme(this.value)"></select>
    <label style="font-size: 0.7em; color: var(--muted); margin-top: 5px;">Шрифт:</label>
    <select id="fontSelect" onchange="changeFont(this.value)"></select>
    <label style="font-size: 0.7em; color: var(--muted); margin-top: 5px;">Масштаб:</label>
    <input type="range" id="zoomInput" min="0.8" max="1.5" step="0.1" value="1" onchange="changeZoom(this.value)">
    <label style="font-size: 0.7em; color: var(--muted); margin-top: 5px;">Цвет текста:</label>
    <input type="color" id="textColorInput" value="#f8fafc" onchange="changeTextColor(this.value)">
    <label style="font-size: 0.7em; color: var(--muted); margin-top: 5px;">Цвет Верити:</label>
    <input type="color" id="verityColorInput" value="#991b1b" onchange="changeVerityColor(this.value)">
    <label style="font-size: 0.7em; color: var(--muted); margin-top: 5px;">Появление слов:</label>
    <select id="animSelect" onchange="changeAnim(this.value)"></select>
    <label style="font-size: 0.7em; color: var(--muted); margin-top: 5px;">Скорость:</label>
    <select id="speedSelect" onchange="changeSpeed(this.value)"></select>
  </div>

  <div class="main-content" id="contentArea"></div>

  <div class="nav-bar">
    <button class="nav-btn" id="prevBtn" onclick="changeSlide(-1)">← Назад</button>
    <span class="page-counter" id="pageCounter">1 / 119</span>
    <button class="nav-btn" id="nextBtn" onclick="changeSlide(1)">Вперед →</button>
  </div>

  function generateThemes() {
    const themes = [];

      const cardL = bgL + 8;
      const textL = 95 - (i % 2) * 5;
      
      const bg = `hsl(${hue}, 40%, ${bgL}%)`;
      const card = `hsl(${hue}, 40%, ${cardL}%)`;
      const text = `hsl(${hue}, 10%, ${textL}%)`;
      const muted = `hsl(${hue}, 20%, 60%)`;
      const border = `hsl(${hue}, 30%, 30%)`;
      const accent = `hsl(${(hue + 180) % 360}, 80%, 60%)`;
      const accent2 = `hsl(${(hue + 120) % 360}, 80%, 60%)`;

    }
    return themes;

    else {

        { t: "Что такое Present Simple?", b: "<p>Время <b>Present Simple</b> обозначает регулярные действия, привычки и факты.</p><ul><li>Привычки (I wake up at 7 am).</li><li>Факты (The sun rises in the east).</li><li>Расписания (The train leaves at 6 pm).</li></ul><div class='example'>I <b>play</b> tennis every Sunday.</div>" },

      div.id = 'slide-' + index;
      
      const isEasterEgg = (index === 118);
      const titleAttr = isEasterEgg ? "onclick='handleEggClick()'" : "";
      
      div.innerHTML = `<h1 ${titleAttr}>${slide.ru.title}</h1><div>${slide.ru.body}</div>`;
      area.appendChild(div);
    });
  }

  function changeSlide(dir) {
    currentSlide += dir;
    if (currentSlide < 0) currentSlide = 0;
    if (currentSlide >= baseSlides.length) currentSlide = baseSlides.length - 1;
    
    document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
    const active = document.getElementById('slide-' + currentSlide);
    if (active) active.classList.add('active');
    
    document.getElementById('prevBtn').disabled = currentSlide === 0;
    document.getElementById('nextBtn').disabled = currentSlide === baseSlides.length - 1;
    document.getElementById('pageCounter').textContent = (currentSlide + 1) + ' / ' + baseSlides.length;
    document.getElementById('contentArea').scrollTop = 0;

    if (currentSlide === 116) initClicker();
    if (currentSlide === 118) startSnake();
  }

  function handleEggClick() {
    clickCount++;
    clearTimeout(window.eggTimer);
    if (clickCount === 3) {
      document.getElementById('hogOverlay').classList.add('show');
      clickCount = 0;
    } else {
      window.eggTimer = setTimeout(() => clickCount = 0, 600);
    }
  }
  function hideHog() { document.getElementById('hogOverlay').classList.remove('show'); }

  // === КЛИКЕР ===
  let score = 0;
  let cPower = 1, cCost = 15, cLvl = 1;
  let aPower = 0, aCost = 50, aLvl = 0;
  let mPower = 1, mCost = 100, mLvl = 1;
  let isVerity = false;
  let verityClicks = 0;
  let verityTalking = false;
  let verityTimeout;

  function initClicker() {
    const wrapper = document.getElementById('coinWrapper');
    if (wrapper) {
      wrapper.innerHTML = `
        <div class="coin" id="coinBtn" onclick="clickCoin()">Монета</div>
        <div style="font-size:0.8em; color:var(--muted); text-align:center; margin-top:10px;">
          До попытки: <span id="progressDisplay">0 / 167</span>
        </div>
      `;
      isVerity = false; verityClicks = 0; verityTalking = false;
      coinClickCounter = 0;
      attemptCounter = 0;
      if (verityTimeout) clearTimeout(verityTimeout);
    }
    updateClickerUI();
  }

  function clickCoin() {
    if (isVerity) {
      verityClicks++;
      
      if (verityTalking) {
        verityTalking = false;
        clearTimeout(verityTimeout);
        const bubble = document.querySelector('.speech-bubble');
        if (bubble) bubble.remove();
        
        const wrapper = document.getElementById('coinWrapper');
        const ball = wrapper.querySelector('.ball');
        if (ball) {
          const stopBubble = document.createElement('div');
          stopBubble.className = 'speech-bubble';
          stopBubble.textContent = 'Стоп';
          stopBubble.style.fontFamily = 'var(--font-main)';
          stopBubble.style.fontSize = '1em';
          ball.appendChild(stopBubble);
          
          setTimeout(() => { if (stopBubble.parentNode) stopBubble.remove(); }, 1000);
        }
      }
      
      if (verityClicks >= 3) {
        verityClicks = 0;
        const wrapper = document.getElementById('coinWrapper');
        wrapper.innerHTML = `
          <div class="monster" onclick="closeMonster()">
            <div class="speech-bubble" style="font-family: var(--font-main);">${verityPhrase}</div>
          </div>
        `;
        
        document.body.classList.add('screen-cracked');
        setTimeout(() => {
          document.body.classList.remove('screen-cracked');
        }, 10000);
      }
      return;
    }

    coinClickCounter++;
    score += cPower * mPower;
    updateClickerUI();
    
    if (coinClickCounter === 67) {
      document.getElementById('hogImg').style.display = 'block';
      document.getElementById('hogImg').src = 'meme.jpg';
      document.getElementById('hogText').textContent = '67';
      document.getElementById('hogOverlay').classList.add('show');
    }

    if (coinClickCounter >= 167) {
      if (Math.random() < 0.1) {
        coinClickCounter = 0;
        attemptCounter = 0;
        spawnVerity();
      } else {
        attemptCounter++;
        if (attemptCounter >= 167) {
          coinClickCounter = 0;
          attemptCounter = 0;
        }
      }
    }
    
    const progressEl = document.getElementById('progressDisplay');
    if (progressEl) {
      if (coinClickCounter < 167) {
        progressEl.textContent = `${coinClickCounter} / 167`;
      } else {
        progressEl.textContent = `Попытка ${attemptCounter} / 167 (10% шанс)`;
      }
    }
  }

  function spawnVerity() {
    const wrapper = document.getElementById('coinWrapper');
    wrapper.innerHTML = `
      <div class="verity-title">Верити</div>
      <div class="ball" onclick="clickCoin()">
        <div class="speech-bubble" style="font-family: var(--font-main);">
          <span class="anim-fade" style="--anim-speed: 0.5s;">${verityPhrase}</span>
        </div>
        <div class="ball-eyes"><div class="eye"><div class="pupil"></div></div><div class="eye"><div class="pupil"></div></div></div>
        <div class="mouth"></div>
      </div>
      <div style="font-size:0.8em; color:var(--muted); text-align:center; margin-top:10px;">
        До попытки: <span id="progressDisplay">0 / 167</span>
      </div>
    `;
    isVerity = true;
    verityTalking = true;
    verityClicks = 0;
    
    verityTimeout = setTimeout(() => {
      if (verityTalking) {
        verityTalking = false;
        const bubble = document.querySelector('.speech-bubble');
        if (bubble) bubble.remove();
      }
    }, 3000);
  }

  function closeMonster() {
    const wrapper = document.getElementById('coinWrapper');
    if (wrapper) {
      wrapper.innerHTML = `
        <div class="coin" id="coinBtn" onclick="clickCoin()">Монета</div>
        <div style="font-size:0.8em; color:var(--muted); text-align:center; margin-top:10px;">
          До попытки: <span id="progressDisplay">0 / 167</span>
        </div>
      `;
      isVerity = false;
      verityTalking = false;
    }
    score = 0; cPower = 1; cCost = 15; cLvl = 1;
    aPower = 0; aCost = 50; aLvl = 0;
    mPower = 1; mCost = 100; mLvl = 1;
    coinClickCounter = 0;
    attemptCounter = 0;
    updateClickerUI();
  }

  function buyUpgrade(type) {
    if (type === 1 && cLvl < 10 && score >= cCost) { score -= cCost; cPower++; cLvl++; cCost *= 2; }
    else if (type === 2 && score >= aCost) { score -= aCost; aPower++; aLvl++; aCost *= 2; }
    else if (type === 3 && mLvl < 10 && score >= mCost) { score -= mCost; mPower *= 2; mLvl++; mCost *= 2; }
    updateClickerUI();
  }

  function updateClickerUI() {
    const s = document.getElementById('scoreDisplay');
    if (s) s.textContent = score;
    const c1 = document.getElementById('costClick');
    if (c1) c1.textContent = cCost;
    const c2 = document.getElementById('costAuto');
    if (c2) c2.textContent = aCost;
    const c3 = document.getElementById('costMult');
    if (c3) c3.textContent = mCost;
    
    const b1 = document.getElementById('btnClick');
    if (b1) { b1.textContent = `Купить (ур. ${cLvl}/10)`; b1.disabled = score < cCost || cLvl >= 10; }
    const b2 = document.getElementById('btnAuto');
    if (b2) { b2.textContent = `Купить (ур. ${aLvl})`; b2.disabled = score < aCost; }
    const b3 = document.getElementById('btnMult');
    if (b3) { b3.textContent = `Купить (ур. ${mLvl}/10)`; b3.disabled = score < mCost || mLvl >= 10; }
  }

  setInterval(() => { if (aPower > 0) { score += aPower; updateClickerUI(); } }, 1000);

  // === ЗМЕЙКА ===
  let snakeCanvas, snakeCtx, snake, snakeDir, food, gameLoop;

  function startSnake() {
    snakeCanvas = document.getElementById('gameCanvas');
    if (!snakeCanvas) return;
    snakeCtx = snakeCanvas.getContext('2d');
    snake = [{x: 10, y: 10}];
    snakeDir = {x: 0, y: 0};
    let targetX = 10, targetY = 10;
    document.getElementById('snakeScore').textContent = 0;
    document.getElementById('snakeRecord').textContent = record;
    placeFood();
    clearInterval(gameLoop);
    gameLoop = setInterval(() => {
      targetX += snakeDir.x;
      targetY += snakeDir.y;
      if (targetX < 0 || targetX >= 20 || targetY < 0 || targetY >= 20) { gameOver(); return; }
      for (let i = 0; i < snake.length; i++) { if (snake[i].x === targetX && snake[i].y === targetY) { gameOver(); return; } }
      snake.unshift({x: targetX, y: targetY});
      if (targetX === food.x && targetY === food.y) {
        document.getElementById('snakeScore').textContent = snake.length - 1;
        if (snake.length - 1 > record) { record = snake.length - 1; localStorage.setItem('snakeRecord', record); document.getElementById('snakeRecord').textContent = record; }
        placeFood();
      } else { snake.pop(); }
      drawSnake();
    }, 120);
  }

  function placeFood() { food = { x: Math.floor(Math.random() * 20), y: Math.floor(Math.random() * 20) }; }

  function drawSnake() {
    snakeCtx.fillStyle = '#0f172a';
    snakeCtx.fillRect(0, 0, 400, 400);
    snakeCtx.fillStyle = '#ef4444';
    snakeCtx.beginPath();
    snakeCtx.arc(food.x * 20 + 10, food.y * 20 + 10, 8, 0, Math.PI * 2);
    snakeCtx.fill();
    snake.forEach((seg, i) => {
      snakeCtx.fillStyle = i === 0 ? '#f59e0b' : '#fcd34d';
      snakeCtx.fillRect(seg.x * 20 + 1, seg.y * 20 + 1, 18, 18);
    });
  }

  function gameOver() {
    clearInterval(gameLoop);
    document.getElementById('hogOverlay').innerHTML = '<h2 class="calligraphy-loss">ВЫ ПРОИГРАЛИ</h2>';
    document.getElementById('hogOverlay').classList.add('show');
  }

  // === НАСТРОЙКИ РАЗРАБОТЧИКА (УДЕРЖАНИЕ 45 СЕК) ===
  let devHoldTimer = null;
  let devHoldStart = 0;

  function startDevHold() {
    devHoldStart = Date.now();
    devHoldTimer = setInterval(() => {
      if (Date.now() - devHoldStart >= 45000) {
        clearInterval(devHoldTimer);
        openDevPanel();
      }
    }, 1000);
  }

  function endDevHold() {
    if (devHoldTimer) clearInterval(devHoldTimer);
    devHoldTimer = null;
  }

  function openDevPanel() {
    let devPanel = document.getElementById('devPanel');
    if (!devPanel) {
      devPanel = document.createElement('div');
      devPanel.id = 'devPanel';
      devPanel.style.cssText = `
        position: fixed; top: 10%; left: 10%; width: 80%; height: 80%;
        background: var(--card); border: 2px solid var(--accent);
        border-radius: 15px; z-index: 10000; padding: 20px; overflow-y: auto;
        box-shadow: 0 0 50px rgba(0,0,0,0.8); font-family: var(--font-main);
        color: var(--text);
      `;
      devPanel.innerHTML = `
        <h2 style="color: var(--accent); text-align: center; margin-bottom: 20px;">Настройки разработчика</h2>
        <div style="margin-bottom: 15px;">
          <label style="display: block; margin-bottom: 5px;">Цвет Верити:</label>
          <input type="color" id="devVerityColor" value="#991b1b" style="width: 100%; padding: 5px;" onchange="changeVerityColor(this.value)">
        </div>
        <div style="margin-bottom: 15px;">
          <label style="display: block; margin-bottom: 5px;">Лицо Верити (URL):</label>
          <input type="text" id="devVerityFace" placeholder="Введите URL картинки" style="width: 100%; padding: 5px; border-radius: 5px; border: 1px solid var(--border); background: var(--bg); color: var(--text);">
        </div>
        <div style="margin-bottom: 15px;">
          <button onclick="deleteConspect()" style="background: red; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer;">Удалить конспект</button>
          <button onclick="location.reload()" style="background: var(--accent); color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer;">Восстановить конспект</button>
        </div>
        <button onclick="document.getElementById('devPanel').remove()" style="background: var(--muted); color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer; width: 100%;">Закрыть</button>
      `;
      document.body.appendChild(devPanel);
    }
    devPanel.style.display = 'block';
  }

  function deleteConspect() {
    baseSlides.length = 0;
    renderSlides();
  }

  // === ЗАПУСК ===
  window.onload = function() {
    initSelects();
    renderSlides();
    document.getElementById('pageCounter').textContent = '1 / ' + baseSlides.length;
  };
</script>
</body>
  </html>
